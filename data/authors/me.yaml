bio: |
  Welcome to my homepage!

  I am a Ph.D. candidate in Economics at the Guanghua School of Management, Peking University. 
  My research lies at the intersection of economic history and political economy. 
  I am particularly interested in how states interact with elites in historical settings, 
  and how these interactions shape political institutions, state capacity, social order, and long-run development. 
  My current research studies topics including state formation, elite co-optation, 
  and the political economy of bureaucratic institutions.

